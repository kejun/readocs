[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "readocs"
version = "0.2.0"
description = "PaperDIY content sync proxy and local management console"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "aiohttp>=3.11,<4", "cryptography>=44", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
device = ["pyserial>=3.5,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]

[project.scripts]
readocs = "readocs.__main__:main"

[tool.setuptools]
package-dir = {"" = "proxy"}

[tool.setuptools.package-data]
readocs = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["proxy"]
asyncio_mode = "auto"
testpaths = ["tests"]
